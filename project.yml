name: Huddle
options:
  bundleIdPrefix: com.krogerjt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L67J56VPBG
targets:
  Huddle:
    type: application
    platform: iOS
    sources:
      - ios/App
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogerjt.huddle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # HUDDLE_SERVER_URL and HUDDLE_APP_TOKEN come from ios/Huddle.xcconfig, which reads the git-ignored ios/Local.xcconfig.
    configFiles:
      Debug: ios/Huddle.xcconfig
      Release: ios/Huddle.xcconfig
    info:
      path: ios/Config/App-Info.plist
      properties:
        CFBundleDisplayName: I Formation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        HuddleServerURL: $(HUDDLE_SERVER_URL)
        HuddleAppToken: $(HUDDLE_APP_TOKEN)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HuddleTests:
    type: bundle.unit-test
    platform: iOS
    # The JSON fixtures in ios/Tests/Fixtures are copied in as resources.
    sources: [ios/Tests]
    dependencies:
      - target: Huddle
schemes:
  Huddle:
    build:
      targets:
        Huddle: all
    test:
      targets: [HuddleTests]
