name: Huddle
options:
  bundleIdPrefix: com.krogerjt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L67J56VPBG
targets:
  Huddle:
    type: application
    platform: iOS
    sources:
      - ios/App
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogerjt.huddle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: HuddleWidgets
    # Push notifications carry the Live Activity updates; the App Group shares team logos with the widget.
    # aps-environment is development because the app is installed from Xcode; a TestFlight build would use production.
    entitlements:
      path: ios/Config/Huddle.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.krogerjt.huddle]
    # HUDDLE_SERVER_URL and HUDDLE_APP_TOKEN come from ios/Huddle.xcconfig, which reads the git-ignored ios/Local.xcconfig.
    configFiles:
      Debug: ios/Huddle.xcconfig
      Release: ios/Huddle.xcconfig
    info:
      path: ios/Config/App-Info.plist
      properties:
        CFBundleDisplayName: I Formation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        HuddleServerURL: $(HUDDLE_SERVER_URL)
        HuddleAppToken: $(HUDDLE_APP_TOKEN)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # The server updates the Live Activity every 30 seconds during games.
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  # The Live Activity (lock screen and Dynamic Island).
  HuddleWidgets:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widgets
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogerjt.huddle.widgets
    entitlements:
      path: ios/Config/HuddleWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.krogerjt.huddle]
    info:
      path: ios/Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: I Formation
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HuddleTests:
    type: bundle.unit-test
    platform: iOS
    # The JSON fixtures in ios/Tests/Fixtures are copied in as resources.
    sources: [ios/Tests]
    dependencies:
      - target: Huddle
schemes:
  Huddle:
    build:
      targets:
        Huddle: all
    test:
      targets: [HuddleTests]
